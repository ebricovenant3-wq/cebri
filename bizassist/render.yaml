# Standalone Blueprint for the BizAssist backend.
# Create it with the Blueprint path set to bizassist/render.yaml.
# This does not replace the root static storefront configuration.
services:
  - type: web
    name: bizassist-whatsapp-api
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    rootDir: bizassist
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    autoDeployTrigger: off
    numInstances: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: FLASK_DEBUG
        value: "false"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: BIZASSIST_ADMIN_TOKEN
        generateValue: true
      - key: CEBRI_SUPABASE_URL
        sync: false
      - key: CEBRI_SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WEBHOOK_ONLY_MODE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: bizassist-postgres
          property: connectionString

databases:
  - name: bizassist-postgres
    databaseName: bizassist
    user: bizassist
    plan: 0.5c-1g
    region: frankfurt
