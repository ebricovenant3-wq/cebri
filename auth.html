<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Sign in or create your Cebri customer account."><title>Sign in | Cebri Curtains &amp; Blinds</title><link rel="stylesheet" href="styles.css"></head>
<body class="account-page">
  <header class="account-header"><a class="brand" href="index.html"><span class="brand-mark">C</span><span><strong>Cebri</strong><small>Curtains &amp; Blinds</small></span></a><a class="account-link" href="shop.html">Back to shop</a></header>
  <main class="account-shell"><section class="account-card"><p class="eyebrow">Your Cebri account</p><h1 id="authTitle">Welcome back</h1><p class="account-intro" id="authIntro">Sign in to manage your profile and view quote requests.</p>
    <div class="auth-tabs" id="authTabs"><button type="button" class="active" data-view="login">Sign in</button><button type="button" data-view="register">Create account</button></div>
    <form id="authForm" class="account-form">
      <label id="nameField" class="hidden">Full name<input name="full_name" autocomplete="name"></label>
      <label id="phoneField" class="hidden">Phone number<input name="phone" type="tel" autocomplete="tel"></label>
      <label id="emailField">Email address<input name="email" type="email" autocomplete="email" required></label>
      <label id="passwordField">Password<input name="password" type="password" autocomplete="current-password" minlength="8" required></label>
      <label id="confirmField" class="hidden">New password<input name="new_password" type="password" autocomplete="new-password" minlength="8"></label>
      <button class="button button-green account-submit" id="authSubmit" type="submit">Sign in</button>
    </form>
    <button type="button" class="account-text-button" id="forgotPassword">Forgot your password?</button>
    <p class="account-message" id="authMessage" role="status" aria-live="polite"></p>
    <p class="account-footnote">Your profile and quote history are private to your account. Account features become available after Cebri connects its secure database.</p>
  </section></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="backend-config.js"></script><script src="supabase-client.js"></script><script src="auth.js"></script>
</body></html>
